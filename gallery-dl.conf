{
    "extractor": {
        "cookies": ["firefox"],
        "skip": true,
        
        "pinterest": {
            "filename": "{id} - {title|grid_title|description:L100//} - {num:>03}.{extension}",
            "original": true,
            "skip": true,
            "metadata": true,
            "videos": true
        },

        "instagram": {
            "filename": "{id} - {title|grid_title|description:L100//} - {num:>03}.{extension}",
            "original": true,
            "skip": true,
            "metadata": true,
            "videos": true
        }
    },

    "output": {
	    "mode": "auto",
	    "progress": true,
	    "shorten": true,
	    "logfile": {
        	"path": "logs/log.log",
        	"mode": "w",
        	"level": "warning",
	    	"format": {
	      		"debug"  : "[{asctime}][{levelname}][{name}] {message}",
	            "info"   : "[{asctime}][{levelname}][{name}]  {message}",
	            "warning": "[{asctime}][{levelname}][{name}]  {message} [Source URL: {extractor.url}]",
	            "error"  : "[{asctime}][{levelname}][{name}]  {message} [Source URL: {extractor.url}]"
	      },
	          "format-date": "%Y-%m-%d-%H-%M-%S"
	    },
	    "unsupportedfile": {
	        "path": "unsupported.txt",
	        "mode": "a",
	        "format": "{asctime} {message}",
	        "format-date": "%Y-%m-%d-%H-%M-%S"
	    }
	},

	"downloader": {
		"progress": 3.0
	}
}